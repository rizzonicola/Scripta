<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sfondo grigio scuro elegante -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22272e" />
      <stop offset="100%" stop-color="#16191d" />
    </linearGradient>

    <!-- Verde acqua Vivido (Teal) per la penna -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Gradient per il tratto ad S -->
    <linearGradient id="strokeGradLeftUnder" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="60%" stop-color="#14b8a6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.35" />
    </linearGradient>

    <!-- Accento metallico per i dettagli della penna -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Ombra pulita (senza glow teal) -->
    <filter id="dropShadowClean" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base dell'icona (Squircle) con sfondo grigio scuro -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g filter="url(#dropShadowClean)">
    
    <!-- TRATTO AD 'S' (Rivolto verso l'interno/sinistra) -->
    <path d="M 387,387 
             C 344,362 309,392 324,412 
             C 339,432 279,437 249,412" 
          fill="none" 
          stroke="url(#strokeGradLeftUnder)" 
          stroke-width="9" 
          stroke-linecap="round" />

    <!-- PENNA SLANCATA E FINE (Inclinata esattamente a 45°) -->
    <g transform="rotate(-45 256 256)">
      
      <!-- 1. CORPO E CAPPUCCIO -->
      <!-- Cappuccio (Parte superiore) -->
      <path d="M 242,50 L 270,50 C 274,50 277,53 277,57 L 275,130 L 237,130 L 235,57 C 235,53 238,50 242,50 Z" 
            fill="url(#tealGrad)" />
      
      <!-- Clip metallica sottile -->
      <path d="M 266,60 L 270,60 C 271,60 272,61 272,62 L 270,180 C 270,183 267,185 264,185 C 262,185 261,183 261,180 L 265,62 C 265,61 265.5,60 266,60 Z" 
            fill="url(#metalGrad)" />

      <!-- Corpo centrale affusolato -->
      <path d="M 237,130 L 275,130 L 272,290 L 240,290 Z" 
            fill="url(#tealGrad)" />

      <!-- Anello metallico di congiunzione -->
      <rect x="239" y="290" width="34" height="4" fill="url(#metalGrad)" />

      <!-- Impugnatura slanciata (Grip) -->
      <path d="M 240,294 L 272,294 L 267,370 L 245,370 Z" 
            fill="url(#tealGrad)" opacity="0.9" />

      <!-- Scanalature discrete sull'impugnatura -->
      <line x1="243" y1="315" x2="269" y2="315" stroke="#121517" stroke-width="1.5" opacity="0.3" />
      <line x1="244" y1="330" x2="268" y2="330" stroke="#121517" stroke-width="1.5" opacity="0.3" />
      <line x1="244.5" y1="345" x2="267.5" y2="345" stroke="#121517" stroke-width="1.5" opacity="0.3" />

      <!-- 2. PUNTA STILOGRAFICA -->
      <!-- Cono di base -->
      <path d="M 245,370 L 267,370 L 263,395 L 249,395 Z" fill="url(#metalGrad)" />
      
      <!-- Pennino stilografico affusolato -->
      <path d="M 249,395 L 263,395 L 256,442 Z" fill="url(#metalGrad)" />
      
      <!-- Bisellatura di luce sulla metà sinistra del pennino -->
      <path d="M 249,395 L 256,395 L 256,442 Z" fill="#ffffff" opacity="0.4" />

      <!-- Intaglio e foro d'aria del pennino -->
      <circle cx="256" cy="410" r="2.5" fill="#16191d" />
      <line x1="256" y1="412.5" x2="256" y2="442" stroke="#16191d" stroke-width="1.5" stroke-linecap="round" />

      <!-- Puntino bianco all'estremità della punta -->
      <circle cx="256" cy="442" r="1.5" fill="#ffffff" />

      <!-- 3. RIFLESSI E LUCI LATERALI -->
      <path d="M 241,55 L 243,130 L 244,290 L 247,370" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="1.8" 
            stroke-linecap="round" 
            opacity="0.35" />

      <path d="M 271,55 L 269,130 L 268,290 L 265,370" 
            fill="none" 
            stroke="#000000" 
            stroke-width="2.2" 
            stroke-linecap="round" 
            opacity="0.4" />
            
    </g>
  </g>
</svg>

