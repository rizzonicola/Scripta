name: scripta
description: "Scripta - Minimal, Markdown-First, highly customizable note-taking application."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+3

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  # Riverpod 3.x: StateNotifier/StateNotifierProvider sono ora "legacy"
  # (spostati in package:flutter_riverpod/legacy.dart, non rimossi) a favore
  # della nuova API Notifier/AsyncNotifier. Vedi i provider in lib/features/*
  # per il dettaglio di quali usano ancora la StateNotifier API legacy
  # (mantenuta 1:1 per non alterare la logica di business/sync) e quali sono
  # stati migrati alla nuova API Notifier.
  flutter_riverpod: ">=3.3.2 <4.0.0"

  # Markdown Rendering & Parsing
  # flutter_md ancora la selezione di testo al modello dati immutabile
  # (Markdown/nodi MD$...) invece che ai RenderObject a schermo: la vista di
  # lettura (markdown_rendered_view.dart) può quindi restare divisa in blocchi
  # dentro una ListView.builder virtualizzata con cacheExtent di default,
  # senza il workaround di realizzazione forzata che serviva col vecchio
  # motore (flutter_markdown_plus) per far funzionare "Seleziona tutto" e la
  # selezione su blocchi fuori schermo.
  flutter_md: ^0.2.0

  # Formule a blocco `$$...$$` con layout matematico 2D (frazioni, radici,
  # matrici...). Le formule inline `$...$` sono invece gestite da flutter_md
  # (`inlineMath: true`, conversione in Unicode): vedi
  # lib/core/utils/markdown_math.dart.
  flutter_math_fork: 0.7.4

  # Persistence & Storage
  shared_preferences: ^2.2.3
  # Database locale (Local-First): sqflite su Android/iOS, sqflite_common_ffi
  # (via sqlite3 nativo) su desktop (Linux/Windows/macOS). Nessun code-gen
  # richiesto (a differenza di Drift/Moor), il che rende lo schema in
  # lib/core/database/app_database.dart puro SQL leggibile e diffabile.
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0

  # Fonts & UI Polish
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  archive: ^4.2.0
  path_provider: ^2.1.6
  file_picker: ^12.2.0
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_android: 2.2.15
  url_launcher_android: 6.3.14

  # ===========================================================================
  # BLOCCO TEMPORANEO - DA SBLOCCARE IL PRIMA POSSIBILE (vedi "Come sbloccare")
  # ===========================================================================
  # Perche': shared_preferences_android 2.5.0 (pubblicata il 17 ott 2026)
  # passa a Pigeon JNI. Nelle build RELEASE Android, R8 (attivo di default)
  # rinomina kotlin.coroutines.Continuation, che package:jni cerca per nome:
  # ogni chiamata a una funzione `suspend` fallisce quindi con
  #   NoSuchMethodError: no non-static method
  #   "...SharedPreferencesApiRegistrar;.getAll(...Continuation;)..."
  # Sintomo: riquadro rosso PlatformException in Impostazioni (sync) e, piu in
  # generale, tutto cio che legge/scrive SharedPreferences. Le build DEBUG non
  # sono colpite. Non e' un difetto dell'app ne' del server.
  # Riferimenti: flutter/flutter#193880, dart-lang/native#3732,
  #              flutter/packages#13151 (PR di correzione lato pigeon).
  #
  # Versione scelta: 2.4.28 = ultima pubblicata PRIMA del passaggio a JNI
  # (nessuna dipendenza da `jni`, usa Kotlin Pigeon su method channel).
  # ATTENZIONE: "2.4.29" compare nel changelog della 2.5.0 ma NON e' mai stata
  # pubblicata su pub.dev: non usarla, `flutter pub get` fallirebbe.
  # Requisiti SDK: Dart >=3.12 / Flutter >=3.44, gli stessi della 2.5.0.
  # `shared_preferences` (^2.3.4 per questo plugin) accetta la 2.4.28.
  #
  # Come sbloccare (TODO): rimuovere la riga qui sotto appena esce una
  # shared_preferences_android > 2.5.0 il cui changelog dichiara la correzione
  # per le build minificate/R8 (regole keep per kotlin.coroutines.Continuation
  # e le altre classi Kotlin cercate per nome), oppure appena
  # dart-lang/native#3732 e flutter/flutter#193880 risultano chiuse e il fix e'
  # incluso in una versione del plugin. Prima di sbloccare: build RELEASE
  # (flutter build apk --release), installare l'APK, aprire Impostazioni e
  # verificare che il riquadro rosso non compaia piu.
  # Se altri plugin passano a Pigeon JNI il sintomo sara' lo stesso: cercare
  # la voce "Pigeon JNI" nei loro changelog.
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/samples/
