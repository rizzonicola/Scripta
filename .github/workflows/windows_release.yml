name: Windows Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Gruppo SEPARATO dagli altri workflow di release: vedi macos_release.yml.
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build del bundle (exe + DLL + data/) per ciascuna architettura.
  #
  # x64  : runner x64 standard.
  # arm64: runner Windows ARM64 NATIVO ('windows-11-arm') con Flutter ARM64.
  #        La cross-compilazione da x64 (`--target-platform windows-arm64`) NON
  #        è disponibile nel canale stable di Flutter (flutter/flutter#129808):
  #        il vecchio step "Verifica che Flutter supporti il target ARM64" falliva
  #        per questo. Da Flutter 3.44 la stable include Dart e runtime nativi
  #        ARM64: su un host ARM64, `flutter build windows` produce direttamente
  #        un eseguibile ARM64 (build/windows/arm64/...).
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Un'architettura che fallisce non deve cancellare l'altra.
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-latest
            build_dir: x64
            msvc_arch: x64
            pe_machine: '0x8664'
          - name: arm64
            runner: windows-11-arm
            build_dir: arm64
            msvc_arch: arm64
            pe_machine: '0xAA64'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # x64: azione standard.
      - name: Setup Flutter (x64)
        if: matrix.name == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # arm64: subosito/flutter-action scarica lo zip x64 dell'SDK (Dart x64,
      # sotto emulazione: produrrebbe un'app x64). Clonando il repository in
      # una PowerShell ARM64 nativa, Flutter (>= 3.44) scarica invece Dart e
      # runtime ARM64. Clone "blobless" (veloce) ma con la storia completa:
      # serve per ricavare la versione da git (un clone --depth 1 darebbe
      # "0.0.0-unknown" e romperebbe il vincolo `flutter: >=3.27.0`).
      - name: Setup Flutter (ARM64 nativo)
        if: matrix.name == 'arm64'
        shell: pwsh
        run: |
          Write-Host "Architettura processo PowerShell: $env:PROCESSOR_ARCHITECTURE"
          $flutterDir = Join-Path $env:RUNNER_TEMP "flutter"
          git clone --filter=blob:none --branch stable https://github.com/flutter/flutter.git $flutterDir
          if ($LASTEXITCODE -ne 0) { throw "git clone di Flutter fallito." }
          Join-Path $flutterDir "bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $flutter = Join-Path $flutterDir "bin\flutter.bat"
          $dart = Join-Path $flutterDir "bin\dart.bat"
          & $flutter --version
          $dartVersion = (& $dart --version 2>&1) | Out-String
          Write-Host $dartVersion

          if ($dartVersion -notmatch "windows_arm64") {
            Write-Host "::warning::Dart non è ARM64 (trovato: $dartVersion). Forzo il ri-scaricamento con PowerShell nativa."
            Remove-Item (Join-Path $flutterDir "bin\cache\engine-dart-sdk.stamp") -Force -ErrorAction SilentlyContinue
            $nativePs = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
            & $nativePs -NoProfile -ExecutionPolicy Bypass -File (Join-Path $flutterDir "bin\internal\update_dart_sdk.ps1")
            $dartVersion = (& $dart --version 2>&1) | Out-String
            Write-Host $dartVersion
            if ($dartVersion -notmatch "windows_arm64") {
              throw "Impossibile ottenere un Dart SDK ARM64 su questo runner."
            }
          }


      - name: Install Dependencies
        run: flutter pub get

      - name: Versione di sqlite3 risolta da pub
        shell: bash
        run: |
          # Diagnostica: sqlite3 >= 3 (build hooks) include la libreria nel
          # bundle, le versioni 2.x no (serve sqlite3.dll accanto all'exe).
          grep -A4 -E '^  (sqlite3|sqlite3_flutter_libs|sqflite_common_ffi):' pubspec.lock || echo "pubspec.lock: pacchetti sqlite non trovati"

      - name: Diagnostica Flutter
        run: flutter doctor -v

      # Nessun --target-platform: Flutter costruisce per l'architettura
      # dell'host (x64 sul runner x64, ARM64 sul runner ARM64).
      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Individua il bundle Release
        shell: bash
        run: |
          BUNDLE="build/windows/${{ matrix.build_dir }}/runner/Release"
          if [ ! -d "$BUNDLE" ]; then
            echo "::error::Cartella $BUNDLE non trovata. Contenuto di build/windows:"
            find build/windows -maxdepth 4 -type d | head -n 40
            exit 1
          fi
          ls "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      # Rete di sicurezza: legge l'header PE dell'exe e verifica che
      # l'architettura sia quella attesa (evita di pubblicare un'app x64
      # col nome "arm64").
      - name: Verifica l'architettura dell'eseguibile
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path $env:BUNDLE -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Nessun .exe nel bundle $env:BUNDLE" }
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $found = '0x{0:X4}' -f $machine
          Write-Host "$($exe.Name): machine = $found (atteso ${{ matrix.pe_machine }})"
          if ($found -ne '${{ matrix.pe_machine }}'.ToUpper().Replace('0X','0x')) {
            throw "Architettura inattesa per $($exe.Name): $found"
          }

      - name: sqlite3.dll già nel bundle?
        id: sqlite_check
        shell: pwsh
        run: |
          if (Test-Path "$env:BUNDLE\sqlite3.dll") {
            "needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "sqlite3.dll già presente nel bundle."
          } else {
            "needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "sqlite3.dll assente: verrà compilata."
          }

      # L'ambiente MSVC viene caricato DOPO 'flutter build' per non influire
      # sul rilevamento della toolchain da parte di Flutter/CMake.
      # Su ARM64 il build è nativo: arch 'arm64' (non più 'amd64_arm64').
      - name: Ambiente MSVC (${{ matrix.msvc_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Compila sqlite3.dll (${{ matrix.name }})
        if: steps.sqlite_check.outputs.needed == 'true'
        shell: pwsh
        run: ./windows/packaging/windows_sqlite_dll.ps1 -OutDir "$env:BUNDLE"

      # Best-effort: il runtime C++ (VC++) è richiesto dall'exe di Flutter e
      # non è incluso nel bundle. Lo copiamo (app-local) se disponibile;
      # altrimenti l'utente deve installare "Microsoft Visual C++ Redistributable".
      - name: Copia il runtime VC++ nel bundle
        shell: pwsh
        run: |
          $arch = "${{ matrix.build_dir }}"
          $redist = $env:VCToolsRedistDir
          if ($redist) {
            $crt = Get-ChildItem -Path (Join-Path $redist $arch) -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($crt) {
              Copy-Item "$($crt.FullName)\*.dll" -Destination $env:BUNDLE -Force
              Write-Host "Runtime VC++ copiato da $($crt.FullName)"
            } else { Write-Host "::warning::CRT $arch non trovato in $redist" }
          } else { Write-Host "::warning::VCToolsRedistDir non impostato" }

      # Il bundle passa al job di packaging (installer). Retention breve: è un
      # artefatto intermedio, non un prodotto finale.
      - name: Upload bundle (intermedio)
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-${{ matrix.name }}
          path: ${{ env.BUNDLE }}
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) Installer: un unico Scripta-windows-<arch>-setup.exe (Inno Setup),
  #    al posto dello zip con la cartella. Gira su runner x64 per entrambe le
  #    architetture (l'installer ARM64 è solo un contenitore di file ARM64:
  #    il compilatore non deve girare su ARM64).
  #    `!cancelled()`: se una sola architettura fallisce il build, l'altra
  #    viene comunque impacchettata e pubblicata.
  # ---------------------------------------------------------------------------
  package-windows:
    name: Installer Windows ${{ matrix.name }}
    needs: build-windows
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        name: [x64, arm64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scarica il bundle
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle-${{ matrix.name }}
          path: bundle

      - name: Bundle ${{ matrix.name }} non disponibile
        if: steps.download.outcome != 'success'
        shell: bash
        run: |
          echo "::warning::Bundle ${{ matrix.name }} non disponibile (build fallito) - installer saltato."

      - name: Installa Inno Setup
        if: steps.download.outcome == 'success'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw "ISCC.exe non trovato dopo l'installazione di Inno Setup." }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compila l'installer
        if: steps.download.outcome == 'success'
        shell: pwsh
        run: |
          # Versione dal tag (v0.8.2 -> 0.8.2); senza tag (run manuale) 0.0.0-dev.
          $version = "0.0.0-dev"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $version = "${{ github.ref_name }}".TrimStart("v") }
          $numeric = ($version -replace '[^0-9.].*$', '').Trim('.')
          if (-not $numeric) { $numeric = "0.0.0" }
          Write-Host "Versione: $version (numerica: $numeric)"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $env:ISCC "/DSourceDir=$((Resolve-Path bundle).Path)" `
                      "/DArch=${{ matrix.name }}" `
                      "/DAppVersion=$version" `
                      "/DAppVersionNumeric=$numeric" `
                      "/DOutDir=$((Resolve-Path dist).Path)" `
                      windows/packaging/windows_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilazione dell'installer fallita." }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Build Artifact
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Scripta-windows-${{ matrix.name }}-setup
          path: dist/Scripta-windows-${{ matrix.name }}-setup.exe

      - name: Upload Installer to Release (tentativo 1)
        id: release_attempt_1
        uses: softprops/action-gh-release@v2
        if: steps.download.outcome == 'success' && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          files: dist/Scripta-windows-${{ matrix.name }}-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attendi prima di ritentare la pubblicazione
        if: steps.download.outcome == 'success' && startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        shell: bash
        run: sleep 15

      - name: Upload Installer to Release (tentativo 2)
        if: steps.download.outcome == 'success' && startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Scripta-windows-${{ matrix.name }}-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
