name: Android Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Gruppo SEPARATO da flatpak.yml (non più condiviso): i due workflow
  # tornano a girare in parallelo invece di mettersi in coda l'uno dietro
  # l'altro. La serializzazione tra i due era un tentativo di correggere un
  # errore intermittente nello step di pubblicazione della release, ma si è
  # rivelata non necessaria: l'errore era un 5xx transitorio lato GitHub, non
  # una vera collisione tra i due job — la protezione effettiva resta il
  # doppio tentativo sullo step di pubblicazione più sotto. Qui la
  # concurrency serve solo al suo scopo originale: evitare che DUE run di
  # QUESTO STESSO workflow sullo stesso ref si sovrappongano.
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Allineato a pubspec.lock: le versioni transitive pinnate da Flutter
          # cambiano tra SDK, quindi il lockfile vale solo con questa versione.
          flutter-version: '3.44.4'
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            # Un tag è una release pubblica: una chiave usa-e-getta renderebbe
            # impossibile verificare/aggiornare l'app e firmerebbe artefatti
            # con un'identità diversa a ogni build. Meglio fallire che
            # pubblicare una release non riproducibile.
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "::error::Release tag senza ANDROID_KEYSTORE_BASE64: firma di release obbligatoria." >&2
              exit 1
            fi
            # Build da branch (non release): chiave temporanea solo per test.
            echo "::warning::Nessun keystore configurato: firma con chiave temporanea (build release ottimizzata, ma non aggiornabile in-place tra versioni)."
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/upload-keystore.jks" \
              -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
              -alias ephemeral -storepass "$EPHEMERAL_PASS" -keypass "$EPHEMERAL_PASS" \
              -dname "CN=Scripta CI temporary key" > /dev/null
            {
              echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
              echo "storePassword=$EPHEMERAL_PASS"
              echo "keyAlias=ephemeral"
              echo "keyPassword=$EPHEMERAL_PASS"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 presente ma manca una delle credenziali del keystore." >&2
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename Split APKs
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/Scripta-x86_64.apk

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Rename Universal APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Scripta-universal.apk

      - name: Upload Artifacts to Release (tentativo 1)
        id: release_attempt_1
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          files: |
            build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
            build/app/outputs/flutter-apk/Scripta-x86_64.apk
            build/app/outputs/flutter-apk/Scripta-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attendi prima di ritentare la pubblicazione
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Upload Artifacts to Release (tentativo 2)
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
            build/app/outputs/flutter-apk/Scripta-x86_64.apk
            build/app/outputs/flutter-apk/Scripta-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
