name: Android Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Gruppo CONDIVISO con flatpak.yml (stesso nome, non "android-release-*"):
  # entrambi i workflow scattano sullo stesso trigger (push di tag v*.*.*) e
  # nell'ultimo step scrivono sulla STESSA GitHub Release per allegare i
  # rispettivi artefatti. Con gruppi separati, GitHub li lascia girare in
  # parallelo tra loro (la concurrency serializza solo le run DELLO STESSO
  # gruppo) e i due job finiscono per leggere/aggiornare la release nello
  # stesso istante — una scrittura concorrente sulla stessa risorsa, causa
  # dell'errore "Unexpected error fetching GitHub release ... HttpError"
  # osservato in entrambi i workflow sullo stesso tag. Un gruppo comune mette
  # in coda l'uno rispetto all'altro invece di farli collidere.
  group: scripta-release-${{ github.ref }}
  # `false`, non `true`: qui vogliamo che il secondo workflow ATTENDA che il
  # primo finisca, non che lo annulli — altrimenti si perderebbero gli
  # artefatti (APK o Flatpak) del job cancellato per lo stesso tag.
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename Split APKs
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/Scripta-x86_64.apk

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Rename Universal APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Scripta-universal.apk

      - name: Upload Artifacts to Release (tentativo 1)
        id: release_attempt_1
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          files: |
            build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
            build/app/outputs/flutter-apk/Scripta-x86_64.apk
            build/app/outputs/flutter-apk/Scripta-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attendi prima di ritentare la pubblicazione
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Upload Artifacts to Release (tentativo 2)
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
            build/app/outputs/flutter-apk/Scripta-x86_64.apk
            build/app/outputs/flutter-apk/Scripta-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
