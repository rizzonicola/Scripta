name: Android Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Gruppo SEPARATO da flatpak.yml (non più condiviso): i due workflow
  # tornano a girare in parallelo invece di mettersi in coda l'uno dietro
  # l'altro. La serializzazione tra i due era un tentativo di correggere un
  # errore intermittente nello step di pubblicazione della release, ma si è
  # rivelata non necessaria: l'errore era un 5xx transitorio lato GitHub, non
  # una vera collisione tra i due job — la protezione effettiva resta il
  # doppio tentativo sullo step di pubblicazione più sotto. Qui la
  # concurrency serve solo al suo scopo originale: evitare che DUE run di
  # QUESTO STESSO workflow sullo stesso ref si sovrappongano.
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            # Release VERE (tag vX.Y.Z): la firma è obbligatoria, mai la
            # chiave di debug. Build di prova (avvio manuale): si prosegue
            # con un APK di debug, che NON viene pubblicato tra le release.
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Secret ANDROID_KEYSTORE_BASE64 mancante: impossibile firmare la release (la chiave di debug non è ammessa)."
              exit 1
            fi
            echo "::warning::Nessun keystore configurato: build di PROVA con APK di debug (solo artifact del workflow, nessuna release)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Split APKs
        if: steps.signing.outputs.signed == 'true'
        run: flutter build apk --release --split-per-abi

      - name: Rename Split APKs
        if: steps.signing.outputs.signed == 'true'
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/Scripta-x86_64.apk

      - name: Build Universal APK
        if: steps.signing.outputs.signed == 'true'
        run: flutter build apk --release

      - name: Rename Universal APK
        if: steps.signing.outputs.signed == 'true'
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Scripta-universal.apk

      - name: Build Debug APKs (prova, senza firma di release)
        if: steps.signing.outputs.signed == 'false'
        run: flutter build apk --debug --split-per-abi

      - name: Upload Debug APKs come artifact del workflow
        if: steps.signing.outputs.signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Scripta-debug-apks
          path: build/app/outputs/flutter-apk/*-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Artifacts to Release (tentativo 1)
        id: release_attempt_1
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          files: |
            build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
            build/app/outputs/flutter-apk/Scripta-x86_64.apk
            build/app/outputs/flutter-apk/Scripta-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attendi prima di ritentare la pubblicazione
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Upload Artifacts to Release (tentativo 2)
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
            build/app/outputs/flutter-apk/Scripta-x86_64.apk
            build/app/outputs/flutter-apk/Scripta-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
