name: Android Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Gruppo SEPARATO da flatpak.yml (non più condiviso): i due workflow
  # tornano a girare in parallelo invece di mettersi in coda l'uno dietro
  # l'altro. La serializzazione tra i due era un tentativo di correggere un
  # errore intermittente nello step di pubblicazione della release, ma si è
  # rivelata non necessaria: l'errore era un 5xx transitorio lato GitHub, non
  # una vera collisione tra i due job — la protezione effettiva resta il
  # doppio tentativo sullo step di pubblicazione più sotto. Qui la
  # concurrency serve solo al suo scopo originale: evitare che DUE run di
  # QUESTO STESSO workflow sullo stesso ref si sovrappongano.
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # Make a release build fail if android/key.properties is missing instead
      # of silently producing an unsigned/debug-signed APK.
      SCRIPTA_REQUIRE_RELEASE_SIGNING: '1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Allineato a pubspec.lock: le versioni transitive pinnate da Flutter
          # cambiano tra SDK, quindi il lockfile vale solo con questa versione.
          flutter-version: '3.44.4'
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The real keystore must NEVER be materialized for a ref that a
          # writer can dispatch or push. Only a v*.*.* tag may use it: a
          # workflow_dispatch run on a branch checks out branch-controlled
          # Gradle code, which could read and exfiltrate the key during the
          # build. Branch builds always get an ephemeral throwaway key.
          if [[ "${GITHUB_REF:-}" != refs/tags/* ]]; then
            echo "::notice::Non-tag build: signing with an ephemeral CI key."
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/upload-keystore.jks" \
              -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
              -alias ephemeral -storepass "$EPHEMERAL_PASS" -keypass "$EPHEMERAL_PASS" \
              -dname "CN=Scripta CI temporary key" > /dev/null
            {
              echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
              echo "storePassword=$EPHEMERAL_PASS"
              echo "keyAlias=ephemeral"
              echo "keyPassword=$EPHEMERAL_PASS"
            } > android/key.properties
            exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Release tag without ANDROID_KEYSTORE_BASE64: release signing is mandatory." >&2
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but a keystore credential is missing." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename Split APKs
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/Scripta-x86_64.apk

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Rename Universal APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Scripta-universal.apk

      - name: Verify release signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in $SDK/build-tools" >&2
            exit 1
          fi
          for apk in build/app/outputs/flutter-apk/Scripta-*.apk; do
            echo "== $apk =="
            "$APKSIGNER" verify --print-certs "$apk" | sed -n '1,12p'
            if "$APKSIGNER" verify --print-certs "$apk" | grep -qi 'CN=Android Debug'; then
              echo "::error::$apk is signed with the Android debug key" >&2
              exit 1
            fi
          done

      - name: Build AAB for Google Play
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          # L'AAB serve solo a Google Play. Lo costruiamo solo sui tag perché
          # solo i tag usano il keystore reale: le run su branch firmano con
          # una chiave temporanea, inutilizzabile per Play.
          AAB_DIR="build/app/outputs/bundle/release"
          rm -f "$AAB_DIR"/*.aab

          set +e
          flutter build appbundle --release
          BUILD_EXIT=$?
          set -e

          # Flutter esce con errore se non trova apkanalyzer (cmdline-tools),
          # anche quando Gradle ha già prodotto un AAB firmato. Accettiamo
          # quel caso solo se il file esiste e supera tutte le verifiche sotto;
          # un errore reale di Gradle non produce l'AAB.
          if [[ ! -f "$AAB_DIR/app-release.aab" ]]; then
            echo "::error::flutter build appbundle failed (exit $BUILD_EXIT) and produced no AAB." >&2
            exit 1
          fi
          if [[ "$BUILD_EXIT" -ne 0 ]]; then
            echo "::warning::flutter build appbundle exited $BUILD_EXIT, but the AAB exists; verifying it before continuing."
          fi

          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '[:space:]')"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" || "$VERSION_NAME" == "$VERSION" ]]; then
            echo "::error::Invalid version in pubspec.yaml: '$VERSION' (expected name+code)" >&2
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid versionCode in pubspec.yaml: '$VERSION_CODE'" >&2
            exit 1
          fi

          AAB="$AAB_DIR/Scripta-${VERSION_NAME}-${VERSION_CODE}.aab"
          mv "$AAB_DIR/app-release.aab" "$AAB"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

          echo "== $AAB =="
          ls -lh "$AAB"

          # Un AAB valido per Play deve contenere il manifest e BundleConfig.pb.
          jar tf "$AAB" | grep -q '^BundleConfig.pb$'
          jar tf "$AAB" | grep -q '^base/manifest/AndroidManifest.xml$'

          # Verifica la firma JAR dell'AAB: Play rifiuta un bundle non firmato.
          JARSIGNER_OUTPUT="$(jarsigner -verify -certs "$AAB" 2>&1)"
          echo "$JARSIGNER_OUTPUT" | tail -n 5
          echo "$JARSIGNER_OUTPUT" | grep -q 'jar verified'

          # La chiave debug non deve mai finire in un AAB destinato a Play.
          keytool -printcert -jarfile "$AAB" | sed -n '1,12p'
          if keytool -printcert -jarfile "$AAB" | grep -qi 'CN=Android Debug'; then
            echo "::error::$AAB is signed with the Android debug key" >&2
            exit 1
          fi

          sha256sum "$AAB"

      - name: Upload AAB artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Scripta-AAB-${{ github.ref_name }}
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Artifacts to Release (tentativo 1)
        id: release_attempt_1
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          files: |
            build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
            build/app/outputs/flutter-apk/Scripta-x86_64.apk
            build/app/outputs/flutter-apk/Scripta-universal.apk
            ${{ env.AAB_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attendi prima di ritentare la pubblicazione
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Upload Artifacts to Release (tentativo 2)
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            build/app/outputs/flutter-apk/Scripta-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Scripta-arm64-v8a.apk
            build/app/outputs/flutter-apk/Scripta-x86_64.apk
            build/app/outputs/flutter-apk/Scripta-universal.apk
            ${{ env.AAB_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
