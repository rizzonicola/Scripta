name: Linux Flatpak Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Gruppo SEPARATO da android_release.yml (vedi il commento gemello lì):
  # tornano a girare in parallelo, senza attendersi a vicenda. La protezione
  # contro l'errore intermittente di pubblicazione resta il doppio tentativo
  # più sotto, non più la serializzazione tra i due workflow.
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flutter:
    name: Build Flutter Linux Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Allineato a pubspec.lock: le versioni transitive pinnate da Flutter
          # cambiano tra SDK, quindi il lockfile vale solo con questa versione.
          flutter-version: '3.44.4'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjson-glib-dev

      - name: Build Flutter Linux
        run: |
          flutter pub get --enforce-lockfile
          flutter build linux --release

      - name: Prepare Bundle Directory
        run: |
          mkdir -p bundle
          cp -r build/linux/*/release/bundle/* bundle/

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-bundle
          path: bundle/
          retention-days: 1

  flatpak:
    name: Package Flatpak
    needs: build-flutter
    runs-on: ubuntu-latest
    container:
      # Digest dell'immagine multi-arch (OCI index), non solo il tag mobile.
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08@sha256:d534700a8a0090dfa5e23ed3ae09106a1beafde54e66b6b1327b27dbd3f0c7c2
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download Flutter Linux Bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-bundle
          path: bundle

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@0fadf5d65cdfbdb9c94c7a2f3637c41206cc1a70 # v6
        with:
          bundle: Scripta.flatpak
          manifest-path: linux/packaging/io.github.scripta.Scripta.json
          cache-key: flatpak-builder-${{ hashFiles('linux/packaging/**') }}
          verbose: true

      - name: Upload Flatpak Artifact to Release (tentativo 1)
        id: release_attempt_1
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        # Non fermare il job qui in caso di errore: vogliamo poter ritentare
        # subito sotto invece di far fallire l'intero workflow al primo
        # errore 5xx transitorio lato GitHub (vedi run #71: "HttpError:
        # Server Error", non un errore riconducibile al nostro codice o al
        # nostro build).
        continue-on-error: true
        with:
          files: Scripta.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attendi prima di ritentare la pubblicazione
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Upload Flatpak Artifact to Release (tentativo 2)
        if: startsWith(github.ref, 'refs/tags/') && steps.release_attempt_1.outcome == 'failure'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Scripta.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
