name: Linux Flatpak Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev flatpak flatpak-builder

      - name: Build Flutter Linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Prepare Bundle Directory for Flatpak
        run: |
          mkdir -p bundle linux/bundle
          cp -r build/linux/x86_64/release/bundle/* bundle/
          cp -r build/linux/x86_64/release/bundle/* linux/bundle/

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Scripta.flatpak
          manifest-path: linux/packaging/io.github.scripta.Scripta.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak Artifact to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Scripta.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
